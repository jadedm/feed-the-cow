server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Vite content-hashes everything under /assets/, so it can be cached for good.
    # `expires` is used rather than add_header, because an add_header in a
    # location block drops the security headers set above.
    location /assets/ {
        expires 1y;
    }

    # Phaser and the game's images and audio keep fixed names across deploys,
    # so a long cache would serve stale files after an update.
    location /src/ {
        expires 1h;
    }

    # A missing file is a real 404, so a lost asset shows up in the network log
    # instead of arriving as index.html.
    location / {
        try_files $uri $uri/ =404;
    }
}
