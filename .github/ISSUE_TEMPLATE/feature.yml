name: Feature request
description: Suggest a change to the game or the project.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this change
      description: What is missing or awkward today, and who it affects.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you would change it. Rough is fine.
    validations:
      required: true
