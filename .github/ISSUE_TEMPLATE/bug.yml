name: Bug report
description: Something in the game does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the game
        2. ...
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Live site or local build, browser and device.
      placeholder: "Live site, Chrome 129 on Android"
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Any errors from the browser developer console. Optional.
      render: text
